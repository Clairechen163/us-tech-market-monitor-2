name: Daily Market Monitor

on:
  schedule:
    # 22:15 UTC is after the 16:00 ET regular-session close
    # in both U.S. daylight and standard time.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market monitor
        run: python market_monitor.py

      - name: Update dashboard and signal badges
        run: python scripts/update_dashboard.py

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.md docs/badges/*.svg
          git diff --cached --quiet || git commit -m "Update market signal dashboard"
          git push

      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: |
            market_report_*.txt
            market_report_*.csv
          retention-days: 30
