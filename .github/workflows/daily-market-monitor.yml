name: Daily Market Monitor

on:
  schedule:
    - cron: '0 13 * * 1-5'   # Runs at 13:00 UTC (≈ 22:00 KST) Mon-Fri
  workflow_dispatch:          # Allows manual run

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market monitor
        run: python market_monitor.py

      - name: Update dashboard
        run: python scripts/update_dashboard.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/badges/*.svg docs/dashboard.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update market data $(date -u +%Y-%m-%d)" && git push)